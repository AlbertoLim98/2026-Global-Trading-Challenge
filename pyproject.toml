[project]
name = "global-trading-challenge"
version = "0.1.0"
description = "Sector Lab: analisi dei settori USA via ETF su dati Alpaca (paper)"
readme = "sector_lab/README.md"
requires-python = ">=3.12"
dependencies = ["alpaca-py>=0.30", "pandas>=2.2", "numpy>=1.26", "openpyxl>=3.1"]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"
